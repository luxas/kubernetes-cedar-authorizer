[workspace]
resolver = "2"
members = ["crates/core", "crates/schema", "crates/webhook", "spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
# Pinned by commit (PLAN.md 1.4 / docs/tpe-risk-report.md Q7): cedar PR #2581 head, includes #2547.
cedar-policy = { git = "https://github.com/cedar-policy/cedar.git", rev = "99a88d53fd587299d41e2d0c8b9da88632490711", features = ["tpe"] }
